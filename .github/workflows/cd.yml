name: cd

# Backend deploys to the prod server. The runner lives ON that server and
# only makes outbound connections, so no public IP or open port is needed.
# Frontend ships via Cloudflare Pages' own GitHub integration (see docs/DEPLOYMENT.md).

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ma-famille]
    env:
      # Set to "podman" as a repo/org variable if the prod server uses Podman.
      CONTAINER_ENGINE: ${{ vars.CONTAINER_ENGINE || 'docker' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and start prod stack
        run: |
          if [ "$CONTAINER_ENGINE" = "podman" ]; then COMPOSE="podman compose"; else COMPOSE="docker compose"; fi
          echo "COMPOSE=$COMPOSE" >> "$GITHUB_ENV"
          $COMPOSE -f docker-compose.yml -f compose.prod.yml up -d --build

      - name: Wait for health gate
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null \
              && curl -fsS http://127.0.0.1:8080/ma-famille/api/v1/health >/dev/null; then
              echo "api and web healthy"
              exit 0
            fi
            sleep 2
          done
          echo "prod stack never became healthy" >&2
          $COMPOSE -f docker-compose.yml -f compose.prod.yml logs --tail=50 api web
          exit 1

      - name: Prune old images
        run: |
          if [ "$CONTAINER_ENGINE" = "podman" ]; then podman image prune -f; else docker image prune -f; fi
