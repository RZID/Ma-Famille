name: cd

# Backend deploys to the prod server. The runner lives ON that server and
# only makes outbound connections, so no public IP or open port is needed.
# Frontend ships via Cloudflare Pages' own GitHub integration (see docs/DEPLOYMENT.md).

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ma-famille]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build and start prod stack
        run: docker compose -f docker-compose.yml -f compose.prod.yml up -d --build

      - name: Wait for health gate
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "api healthy"
              exit 0
            fi
            sleep 2
          done
          echo "api never became healthy" >&2
          docker compose -f docker-compose.yml -f compose.prod.yml logs --tail=50 api
          exit 1

      - name: Prune old images
        run: docker image prune -f
