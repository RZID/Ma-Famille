name: deploy

# Backend + frontend edge dist. GitHub-hosted runners deliver to the
# prod server over SSH through the Cloudflare Tunnel — no self-hosted
# runner, no public IP. See docs/DEPLOYMENT.md.
# Logic lives in scripts/deploy-{backend,frontend}.sh so local SSH deploy
# and CI use the same path.
#
# Required secrets: SSH_PRIVATE_KEY, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
# Optional secrets: DOKU_CLIENT_ID, DOKU_SECRET_KEY (sandbox for now — swap
#   the values and the base URL when the production account is ready),
#   MANAGER_PASSWORD (the one password that opens the manager dashboard)
# Optional vars: DEPLOY_HOST (default be-ssh.rzidinc.com),
#   DEPLOY_USER (default deploy), DEPLOY_APP_DIR (default /home/deploy/ma-famille),
#   SEED_DB (default 1; set 0 to skip the idempotent demo seed after deploy)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
  DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/home/deploy/ma-famille' }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Preflight prod server
        run: |
          ssh prod "APP_DIR='$DEPLOY_APP_DIR' sh -s" <<'EOF'
          set -e
          fail() { echo "PREFLIGHT FAIL: $1" >&2; exit 1; }
          missing=""
          need() { command -v "$1" >/dev/null || missing="$missing $1($2)"; }
          command -v podman >/dev/null || fail "podman not installed"
          (podman compose version >/dev/null 2>&1 || command -v podman-compose >/dev/null) || fail "no compose (install podman compose plugin or podman-compose)"
          [ -e /sys/fs/cgroup/cgroup.controllers ] || fail "cgroup v2 unavailable — on Alpine: doas rc-update add cgroups boot && reboot"
          need newuidmap shadow
          need fuse-overlayfs fuse-overlayfs
          need buildah buildah
          need iptables iptables
          { command -v curl >/dev/null || command -v wget >/dev/null; } || missing="$missing curl-or-wget(curl)"
          [ -z "$missing" ] || fail "missing binaries:$missing — one shot: doas apk add shadow fuse-overlayfs buildah iptables curl"
          [ -f "$APP_DIR/backend/.env" ] || echo "PREFLIGHT WARN: $APP_DIR/backend/.env missing — create it from backend/.env.prod.example"
          [ -f "$APP_DIR/.env" ] || echo "PREFLIGHT WARN: $APP_DIR/.env missing (POSTGRES_*/VITE_API_URL for compose)"
          echo "PREFLIGHT OK"
          EOF
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Keep the edge able to pass a websocket through
        run: |
          # The files go over stdin rather than scp: the tunnel drops the
          # extra connection often enough to fail a deploy over it.
          ssh prod 'mkdir -p ~/scripts && cat > ~/scripts/patch_edge_websocket.py' < scripts/patch_edge_websocket.py
          ssh prod 'cat > ~/scripts/patch-edge-websocket.sh' < scripts/patch-edge-websocket.sh
          ssh prod 'sh ~/scripts/patch-edge-websocket.sh /home/deploy/edge/nginx.conf'

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy backend via script
        run: bash scripts/deploy-backend.sh
        env:
          DEPLOY_HOST: prod
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ env.DEPLOY_APP_DIR }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # The DOKU keys are written into the server's backend/.env before the
          # stack starts. Sandbox for now; change the secret values and the
          # base URL together when the production account is ready.
          DOKU_CLIENT_ID: ${{ secrets.DOKU_CLIENT_ID }}
          DOKU_SECRET_KEY: ${{ secrets.DOKU_SECRET_KEY }}
          DOKU_BASE_URL: ${{ vars.DOKU_BASE_URL || 'https://api-sandbox.doku.com' }}
          # Without this the manager dashboard on the server has no password
          # and answers every manager write.
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}

      - name: Deploy frontend via script
        run: bash scripts/deploy-frontend.sh
        env:
          DEPLOY_HOST: prod
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ env.DEPLOY_APP_DIR }}
          VITE_BASE_PATH: /ma-famille/
          VITE_API_URL: https://college-api.rzidinc.com/ma-famille
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
