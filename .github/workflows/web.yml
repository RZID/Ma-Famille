name: web

# Frontend ships to Cloudflare Pages + Worker from CI:
# - root build      → project ma-famille      (previews, pages.dev)
# - prefixed build  → project ma-famille-path (served at college.rzidinc.com/ma-famille/*)
# - worker          → routes the college subpath to the prefixed build
#
# Required secrets: CLOUDFLARE_API_TOKEN (Pages:Edit + Workers Scripts:Edit),
#   CLOUDFLARE_ACCOUNT_ID
# Env: VITE_API_URL comes from vars (fallback: prod API).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "workers/**"
      - "wrangler.toml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://college-api.rzidinc.com/ma-famille' }}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm --prefix frontend ci

      - name: Build root (previews)
        run: npm --prefix frontend run build

      - name: Deploy previews to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=ma-famille --commit-dirty=true

      - name: Build prefixed (college subpath)
        run: npm --prefix frontend run build
        env:
          VITE_BASE_PATH: /ma-famille/

      - name: Deploy subpath build to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=ma-famille-path --commit-dirty=true

      - name: Deploy router worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
