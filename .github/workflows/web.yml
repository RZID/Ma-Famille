name: web

# Frontend previews on Cloudflare Pages. Production FE is served by the
# edge static server (see deploy.yml dist delivery), so this workflow only
# keeps previews + pages.dev working.
#
# Required secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID
# Env: VITE_API_URL comes from vars (fallback: prod API).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://college-api.rzidinc.com/ma-famille' }}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm --prefix frontend ci

      - name: Build
        run: npm --prefix frontend run build

      - name: Deploy previews to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=ma-famille --commit-dirty=true
