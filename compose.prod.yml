# Production overlay for the prod server. Dev keeps using docker-compose.yml.
# Usage on the server: docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
#
# The database lives on a SEPARATE VM, so this stack starts api only.
# DATABASE_URL comes from backend/.env (see backend/.env.prod.example).
# Need a local DB instead? Start the base file's db with:
#   docker compose -f docker-compose.yml -f compose.prod.yml --profile localdb up -d db
#
# The API binds to 127.0.0.1 only — it is exposed publicly through the
# existing Cloudflare Tunnel ingress, never directly.
services:
  db:
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mafamille}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mafamille}
      POSTGRES_DB: ${POSTGRES_DB:-mafamille}

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      ROOT_PATH: /ma-famille
    ports:
      - "127.0.0.1:8000:8000"

  # Public entrypoint for the tunnel (LXC reaches the VM over LAN, so this
  # binds all interfaces — the api above stays loopback-only).
  proxy:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
