# Production overlay for the prod server. Dev keeps using docker-compose.yml.
# Usage on the server: docker compose -f docker-compose.yml -f compose.prod.yml up -d --build
#
# The API binds to 127.0.0.1 only — it is exposed publicly through the
# existing Cloudflare Tunnel ingress, never directly.
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mafamille}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mafamille}
      POSTGRES_DB: ${POSTGRES_DB:-mafamille}

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mafamille}:${POSTGRES_PASSWORD:-mafamille}@db:5432/${POSTGRES_DB:-mafamille}
      ROOT_PATH: /ma-famille
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://college.rzidinc.com/ma-famille}
        VITE_BASE_PATH: /ma-famille/
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
