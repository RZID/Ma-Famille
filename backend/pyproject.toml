[project]
name = "ma-famille-api"
version = "0.1.0"
description = "Sports Venue Booking API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Filter below silences one DeprecationWarning raised by starlette itself at
# import time (anyio alias); our code raises none. Re-check each dependency
# upgrade and drop the filter once upstream migrates.
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
