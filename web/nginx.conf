server {
    listen 8080;
    server_name _;

    location = /ma-famille { return 301 /ma-famille/; }

    # API keeps its full prefix; FastAPI strips ROOT_PATH before routing.
    location /ma-famille/api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: static files first, everything else falls back to index.html.
    location /ma-famille/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /ma-famille/index.html;
    }
}
