# Local PostgreSQL. Works with Docker and Podman (compose spec, no engine-specific keys).
# Docker: make db-up
# Podman: make db-up CONTAINER_ENGINE=podman
services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mafamille
      POSTGRES_PASSWORD: mafamille
      POSTGRES_DB: mafamille
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafamille -d mafamille"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
