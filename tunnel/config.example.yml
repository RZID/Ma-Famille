# Cloudflared ingress snippet for the prod server tunnel.
# Merge the college.rzidinc.com rule into the existing config.yml
# (specific paths first, catch-all last), then: cloudflared tunnel restart.
tunnel: <tunnel-id>
credentials-file: /root/.cloudflared/<tunnel-id>.json

ingress:
  - hostname: college.rzidinc.com
    path: /ma-famille/*
    service: http://127.0.0.1:8080
  # ... existing rules for the rest of college.rzidinc.com ...
  - service: http_status:404
